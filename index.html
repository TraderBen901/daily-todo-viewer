<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>To-do quotidienne</title>
<style>
:root{--ink:#17202a;--muted:#687481;--paper:#f5f2eb;--card:#fff;--work:#146c5a;--private:#8d4f7d;--line:#ded9ce;--amber:#b56b16}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1120px;margin:auto;padding:28px 22px 60px}header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:12px;font-weight:700}h1{font:700 clamp(31px,5vw,55px)/1.02 Georgia,serif;margin:5px 0}.date,.meta,footer,.aside{color:var(--muted)}.progress-wrap{min-width:220px;text-align:right}.progress{height:9px;background:#ddd7cb;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:var(--work);transition:.25s}.agenda{background:#17202a;color:white;border-radius:18px;padding:18px 22px;margin:18px 0}.agenda h2{margin:0 0 9px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}.agenda ul{display:flex;flex-wrap:wrap;gap:10px 22px;list-style:none;padding:0;margin:0}.agenda time{font-weight:800;color:#9fe1d1;margin-right:7px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-top:22px}.tab{border:0;background:transparent;padding:13px 20px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}.tab.active[data-tab=work]{color:var(--work);border-color:var(--work)}.tab.active[data-tab=private]{color:var(--private);border-color:var(--private)}.panel{display:none}.panel.active{display:block}section{margin:25px 0}section>h2,.aside h2{font:700 21px Georgia,serif;margin:0 0 12px}.task-list{display:grid;gap:10px}.task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 3px 12px #17202a0a}.task.high{border-left:5px solid var(--amber)}.check input{position:absolute;opacity:0}.check span{display:block;width:22px;height:22px;border:2px solid #a9aca7;border-radius:7px;cursor:pointer}.check input:checked+span{background:var(--work);border-color:var(--work);box-shadow:inset 0 0 0 4px white}.task.done{opacity:.52}.task.done h3{text-decoration:line-through}.task h3{font-size:16px;margin:0 0 4px}.task p{margin:0 0 6px;color:#46515b}.meta{font-size:12px;text-transform:uppercase;letter-spacing:.045em}.roll{border:1px solid var(--line);background:#faf8f3;border-radius:9px;padding:6px 9px;color:var(--muted);cursor:pointer}.roll.active{background:#fff1d7;border-color:#e2a24e;color:#7d4a08}.add-box{display:grid;grid-template-columns:1fr auto;gap:8px;margin:24px 0}.add-box input{border:1px solid var(--line);border-radius:11px;padding:12px;background:white}.add-box button{border:0;border-radius:11px;background:var(--work);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.aside{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.warnings{background:#fff4df;border:1px solid #ebc67d;border-radius:12px;padding:12px 18px}.empty{color:var(--muted);font-style:italic}footer{margin-top:35px;font-size:12px}.fatal{max-width:720px;margin:80px auto;background:white;border:1px solid var(--line);padding:25px;border-radius:16px}@media(max-width:650px){header{grid-template-columns:1fr}.progress-wrap{text-align:left}.agenda ul{display:block}.agenda li{margin:7px 0}.task{grid-template-columns:30px 1fr}.roll{grid-column:2}}
</style></head><body><main id="app"></main>
<script>
'use strict';
const PREFIX='hermes-daily-todo:';let DATA,DAY;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function decodePayload(){const raw=location.hash.slice(1);if(!raw){const cached=localStorage.getItem(PREFIX+'last-payload');if(!cached)throw new Error('Aucune liste transmise.');return JSON.parse(cached)}history.replaceState(null,'',location.pathname+location.search);const b64=raw.replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const decoded=new TextDecoder().decode(bytes);const data=JSON.parse(decoded);localStorage.setItem(PREFIX+'last-payload',JSON.stringify(data));return data}
function getState(day=DAY){try{return JSON.parse(localStorage.getItem(PREFIX+day)||'{}')}catch(e){return {}}}function save(s){localStorage.setItem(PREFIX+DAY,JSON.stringify(s));progress()}
function taskNode(t,area){const card=el('article','task '+(t.priority==='high'?'high':''));card.dataset.id=t.id;card.dataset.area=area;const label=el('label','check'),check=document.createElement('input'),box=el('span');check.type='checkbox';check.className='done';label.append(check,box);const body=el('div','task-body'),h=el('h3','',t.title||'Action à préciser');body.append(h);if(t.why)body.append(el('p','',t.why));const bits=[t.duration,t.deadline,t.source].filter(Boolean);if(bits.length)body.append(el('div','meta',bits.join(' · ')));const roll=el('button','roll','Demain');roll.title='Reporter explicitement au lendemain';card.append(label,body,roll);wire(card);return card}
function wire(card){const id=card.dataset.id,s=getState(),check=card.querySelector('.done'),roll=card.querySelector('.roll');check.checked=!!(s[id]&&s[id].done);roll.classList.toggle('active',!!(s[id]&&s[id].roll));card.classList.toggle('done',check.checked);check.onchange=()=>{const q=getState();q[id]=Object.assign(q[id]||{},{done:check.checked});save(q);card.classList.toggle('done',check.checked)};roll.onclick=()=>{const q=getState();q[id]=Object.assign(q[id]||{},{roll:!(q[id]&&q[id].roll),title:card.querySelector('h3').textContent,area:card.dataset.area});save(q);roll.classList.toggle('active',q[id].roll)}}
function section(title,tasks,area,empty){const s=el('section'),h=el('h2','',title),list=el('div','task-list');s.append(h,list);if(tasks.length)tasks.forEach(t=>list.append(taskNode(t,area)));else list.append(el('p','empty',empty));return s}
function addBox(area,panel){const box=el('div','add-box'),input=document.createElement('input'),btn=el('button','','Ajouter');input.placeholder=area==='work'?'Ajouter une tâche professionnelle…':'Ajouter une tâche privée…';box.append(input,btn);btn.onclick=()=>{const title=input.value.trim();if(!title)return;const id='manual-'+Date.now(),q=getState();q[id]={title,area,manual:true};save(q);const task={id,title,source:'Ajout manuel',priority:'normal'},lists=panel.querySelectorAll('.task-list');(lists[1]||lists[0]).append(taskNode(task,area));input.value=''};panel.append(box)}
function sourceTasks(data){const out=[];for(const area of ['work','private']){const group=data&&data[area]||{};for(const section of ['outcomes','actions','followups'])for(const task of group[section]||[])out.push({task,area})}return out}
function carry(panelByArea){const previous=DATA.previous_day;if(!previous||!previous.date)return;const old=getState(previous.date),now=getState(),currentIds=new Set(sourceTasks(DATA).map(x=>x.task.id)),seen=new Set();const append=(id,title,area,why,source)=>{if(!title||!panelByArea[area]||currentIds.has(id)||seen.has(id))return;const nid='carry-'+previous.date+'-'+id;if(now[nid]&&now[nid].done)return;seen.add(id);now[nid]=Object.assign(now[nid]||{},{title,area,manual:true});const lists=panelByArea[area].querySelectorAll('.task-list');(lists[1]||lists[0]).append(taskNode({id:nid,title,why:why||'Tâche non terminée la veille.',source:source||'Report automatique de la veille',priority:'normal'},area))};sourceTasks(previous).forEach(({task,area})=>{if(!(old[task.id]&&old[task.id].done))append(task.id,task.title,area,'Non terminée le '+(previous.display_date||previous.date)+'.',task.source?'Report de la veille · '+task.source:'Report automatique de la veille')});Object.entries(old).forEach(([id,v])=>{if(v&&v.manual&&v.title&&!v.done)append(id,v.title,v.area||'work','Ajout manuel non terminé la veille.','Report automatique de la veille')});save(now)}
function progress(){const tasks=[...document.querySelectorAll('.task')],done=tasks.filter(x=>x.querySelector('.done').checked).length;const txt=document.getElementById('progressText'),bar=document.getElementById('progressBar');if(txt)txt.textContent=done+' / '+tasks.length+' terminée'+(done>1?'s':'');if(bar)bar.style.width=(tasks.length?100*done/tasks.length:0)+'%'}
function render(){DAY=DATA.date;const app=document.getElementById('app');app.className='shell';const header=el('header'),left=el('div');left.append(el('div','eyebrow','Cap du jour'),el('h1','','To-do quotidienne'),el('div','date',DATA.display_date||DAY));const pw=el('div','progress-wrap'),pt=el('b','','0 tâche terminée'),p=el('div','progress'),pi=el('i');pt.id='progressText';pi.id='progressBar';p.append(pi);pw.append(pt,p);header.append(left,pw);app.append(header);const ag=el('div','agenda');ag.append(el('h2','','Agenda et contraintes'));const ul=el('ul');(DATA.agenda||[]).forEach(a=>{const li=el('li');li.append(el('time','',a.time||''),el('span','',a.title||''));ul.append(li)});if(!ul.children.length)ul.append(el('li','empty','Aucun rendez-vous confirmé aujourd’hui.'));ag.append(ul);app.append(ag);if((DATA.warnings||[]).length){const w=el('ul','warnings');DATA.warnings.forEach(x=>w.append(el('li','',x)));app.append(w)}const nav=el('nav','tabs'),tabs=[['work','Travail'],['private','Privé']],panels={};tabs.forEach(([id,label],i)=>{const b=el('button','tab'+(i?'':' active'),label);b.dataset.tab=id;nav.append(b);const panel=el('div','panel'+(i?'':' active'));panel.id=id;panels[id]=panel});app.append(nav);const w=DATA.work||{},pr=DATA.private||{};panels.work.append(section('Les 3 résultats du jour',w.outcomes||[],'work','Aucun résultat prioritaire fiable détecté.'),section('Actions et préparations',w.actions||[],'work','Aucune autre action professionnelle retenue.'),section('Relances et attentes',w.followups||[],'work','Aucune relance professionnelle due.'));addBox('work',panels.work);panels.private.append(section('Priorité personnelle',pr.outcomes||[],'private','Aucune priorité personnelle impérative détectée.'),section('Actions privées',pr.actions||[],'private','Aucune autre action privée retenue.'),section('Relances et échéances',pr.followups||[],'private','Aucune relance privée due.'));addBox('private',panels.private);app.append(panels.work,panels.private);const aside=el('div','aside');aside.append(el('h2','','Délibérément différé'));const dl=el('ul');(DATA.deferred||['Rien n’a été explicitement écarté.']).forEach(x=>dl.append(el('li','',x)));aside.append(dl,el('p','','Les éléments incertains ne deviennent pas automatiquement des priorités.'));app.append(aside);const foot=el('footer','',(DATA.generated_at?'Généré '+DATA.generated_at+' · ':'')+(DATA.source_summary||'Sources non précisées')+' — Les coches, ajouts et reports restent dans ce navigateur.');app.append(foot);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});carry(panels);progress()}
try{DATA=decodePayload();if(!DATA||!DATA.date)throw new Error('Format de liste invalide.');render()}catch(e){const a=document.getElementById('app');a.className='fatal';a.append(el('h1','','To-do indisponible'),el('p','',e.message))}
</script></body></html>
